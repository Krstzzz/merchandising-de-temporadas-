<section class="auth-wrap">
  <div class="auth-logo">
    <a class="logo" routerLink="/">Trend<span>Store</span></a>
  </div>
  <div class="auth-card">
    <h2>Bienvenido de vuelta</h2>
    <p class="sub">Inicia sesión en tu cuenta</p>
    <div class="form-group">
      <label class="form-label">Correo electrónico</label>
      <input class="form-input" type="email" placeholder="tu@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input class="form-input" type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary full" (click)="login()">Iniciar sesión</button>
    <a class="btn-outline full guest" routerLink="/">Continuar como invitado</a>
    <div class="auth-switch">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></div>
    <div class="auth-switch admin-link"><a routerLink="/admin">Panel Admin →</a></div>
  </div>
</section>
