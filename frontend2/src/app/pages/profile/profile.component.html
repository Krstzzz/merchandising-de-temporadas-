<section class="profile-page">
  <div class="page-title">
    <h2>Mi cuenta</h2>
    <p>Gestiona tus datos y revisa tus pedidos</p>
  </div>

  @if (profileForm) {
  <div class="profile-layout">
    <div class="profile-panel">
      <div class="panel-header">
        <h3>Mis datos</h3>
        <button class="btn-outline small" type="button" (click)="logout()">Cerrar sesión</button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input class="form-input" [(ngModel)]="profileForm.nombre" name="nombre">
        </div>

        <div class="form-group">
          <label class="form-label">Apellido</label>
          <input class="form-input" [(ngModel)]="profileForm.apellido" name="apellido">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Correo</label>
        <input class="form-input" [(ngModel)]="profileForm.email" name="email" type="email">
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input class="form-input" [(ngModel)]="profileForm.telefono" name="telefono">
      </div>

      <div class="form-group">
        <label class="form-label">Dirección</label>
        <input class="form-input" [(ngModel)]="profileForm.direccion" name="direccion">
      </div>

      <button class="btn-primary" type="button" (click)="saveProfile()">Guardar cambios</button>
    </div>

    <div class="profile-panel">
      <h3>Mis pedidos</h3>

      @for (order of orders.orders(); track order.id) {
      <div class="order-card">
        <div>
          <strong>Pedido #TS-{{ order.id }}</strong>
          <p>{{ order.fechaPedido }}</p>
        </div>
        <div>
          <span class="status">{{ order.estado }}</span>
          <strong>S/. {{ order.total }}</strong>
        </div>
      </div>
      } @empty {
      <p class="empty">Todavía no tienes pedidos.</p>
      }
    </div>
  </div>
  }
</section>
