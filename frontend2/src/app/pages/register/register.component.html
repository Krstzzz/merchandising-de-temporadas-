<section class="auth-wrap">
  <div class="auth-logo">
    <a class="logo" routerLink="/">Trend<span>Store</span></a>
  </div>
  <div class="auth-card">
    <h2>Crear cuenta</h2>
    <p class="sub">Únete a la comunidad TrendStore</p>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Nombre</label
        ><input
          class="form-input"
          [(ngModel)]="registerForm.nombre"
          name="nombre"
          placeholder="Juan"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Apellido</label
        ><input
          class="form-input"
          [(ngModel)]="registerForm.apellido"
          name="apellido"
          placeholder="Pérez"
        />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Correo electrónico</label
      ><input
        class="form-input"
        type="email"
        [(ngModel)]="registerForm.email"
        name="email"
        placeholder="tu@email.com"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label
      ><input
        class="form-input"
        type="password"
        [(ngModel)]="registerForm.password"
        name="password"
        placeholder="Mínimo 8 caracteres"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Teléfono</label>
      <input
        class="form-input"
        [(ngModel)]="registerForm.telefono"
        name="telefono"
        placeholder="+51 999 999 999"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Dirección</label>
      <input
        class="form-input"
        [(ngModel)]="registerForm.direccion"
        name="direccion"
        placeholder="Av. Ejemplo 123"
      />
    </div>

    <button class="btn-primary full" (click)="create()">Crear cuenta</button>

    <div class="auth-switch">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </div>
  </div>
</section>
